<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Yayath Spaces CRM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 36px 32px;
        }
        .brand-title {
            font-size: 1.6rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 2px;
        }
        .brand-black { color: #0f172a; }
        .brand-purple { color: #6366f1; }
        .brand-subtitle {
            font-size: 0.8rem;
            color: #64748b;
            text-align: center;
            font-weight: 600;
            margin-bottom: 28px;
        }
        .form-control {
            font-size: 0.88rem;
            padding: 10px 14px;
            border-radius: 8px;
        }
        .btn-primary {
            background-color: #6366f1;
            border-color: #6366f1;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 10px;
            border-radius: 8px;
        }
        .btn-primary:hover {
            background-color: #4f46e5;
            border-color: #4f46e5;
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-title">
        <span class="brand-black">Yayath</span> <span class="brand-purple">Spaces</span>
    </div>
    <div class="brand-subtitle">Lead Management CRM Login</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for cat, msg in messages %}
                <div class="alert alert-{{ cat }} py-2 px-3 small rounded-3 mb-3" role="alert">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="/login">
        <div class="mb-3">
            <label class="form-label fw-bold small text-dark">User ID / Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
                <input type="text" name="login_id" class="form-control" placeholder="e.g. kiriti or admin" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold small text-dark">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-2">
            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to CRM
        </button>
    </form>
</div>

</body>
</html>
