services:
  - type: web
    name: 99acres-crm
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: 99acres-crm-db
          property: connectionString
databases:
  - name: 99acres-crm-db
    plan: free
