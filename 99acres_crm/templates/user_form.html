{% extends "base.html" %}
{% block title %}{{ action }} User - Yayath 99Acres CRM{% endblock %}
{% block content %}

<div class="mb-4">
    <h3 class="fw-bold mb-1"><i class="bi bi-person-gear text-primary me-2"></i>{{ action }} User</h3>
    <small class="text-muted">Configure user details and assign permissions.</small>
</div>

<div class="card card-custom p-4 col-md-8">
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold">Full Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" value="{{ user.name if user else '' }}" placeholder="e.g. Kirti Rana" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Email Address <span class="text-danger">*</span></label>
            <input type="email" name="email" class="form-control" value="{{ user.email if user else '' }}" placeholder="user@yayath.com" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Role <span class="text-danger">*</span></label>
            <select name="role" class="form-select">
                <option value="Admin" {{ 'selected' if user and user.role == 'Admin' }}>Admin (Full Access)</option>
                <option value="Manager" {{ 'selected' if user and user.role == 'Manager' }}>Manager (Team Lead & Reports)</option>
                <option value="Sales Executive" {{ 'selected' if not user or user.role == 'Sales Executive' }}>Sales Executive (Lead Management)</option>
            </select>
        </div>
        {% if user %}
        <div class="mb-3">
            <label class="form-label fw-bold">Account Status</label>
            <select name="status" class="form-select">
                <option value="Active" {{ 'selected' if user.status == 'Active' }}>Active</option>
                <option value="Inactive" {{ 'selected' if user.status == 'Inactive' }}>Inactive</option>
            </select>
        </div>
        {% endif %}
        <hr class="my-4">
        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-circle me-1"></i>{{ action }} User</button>
        <a href="/users" class="btn btn-outline-secondary px-4 ms-2">Cancel</a>
    </form>
</div>

{% endblock %}
