{% extends "base.html" %}{% block content %}<div class="page-head"><div><div class="eyebrow">Administration</div><h1>Users</h1><p>Manage CRM access and assignments.</p></div></div><div class="row g-4"><div class="col-lg-5"><div class="panel"><h3>Add user</h3><form method="post"><input class="form-control mb-2" name="username" placeholder="Username" required><input class="form-control mb-2" type="email" name="email" placeholder="Email" required><input class="form-control mb-2" type="password" name="password" placeholder="Temporary password" required><select class="form-select mb-3" name="role"><option>sales</option><option>admin</option></select><button class="btn btn-primary w-100">Create user</button></form></div></div><div class="col-lg-7"><div class="panel"><div class="table-responsive"><table class="table crm-table"><thead><tr><th>User</th><th>Role</th><th>State</th><th>Action</th></tr></thead><tbody>{% for u in users %}<tr><td><b>{{u.username}}</b><small>{{u.email}}</small></td><td>{{u.role}}</td><td>{% if u.active %}<span class="badge bg-success-subtle text-success">Active</span>{% else %}<span class="badge bg-secondary">Disabled</span>{% endif %}</td><td><button class="btn btn-sm btn-light" onclick="toggleUser({{u.id}})">Toggle</button></td></tr>{% endfor %}</tbody></table></div></div></div></div>{% endblock %}
