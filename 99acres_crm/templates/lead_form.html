{% extends "base.html" %}{% block content %}
<div class="page-head"><div><div class="eyebrow">CRM / Leads</div><h1>New Lead</h1><p>Create a persistent 99Acres lead record.</p></div></div>
<form method="post"><div class="row g-4"><div class="col-lg-8"><div class="panel form-panel"><h3>Lead & contact</h3><div class="row g-3"><div class="col-md-6"><label>Lead ID</label><input class="form-control" name="lead_id" placeholder="Auto-generated if blank"></div><div class="col-md-6"><label>Client name *</label><input class="form-control" name="client_name" required></div><div class="col-md-6"><label>Company</label><input class="form-control" name="company_name"></div><div class="col-md-6"><label>Phone</label><input class="form-control" name="phone"></div><div class="col-md-6"><label>Alternate phone</label><input class="form-control" name="alternate_phone"></div><div class="col-md-6"><label>Email</label><input class="form-control" type="email" name="email"></div><div class="col-md-6"><label>Location</label><input class="form-control" name="location"></div><div class="col-md-6"><label>Requirement</label><input class="form-control" name="requirement"></div><div class="col-md-6"><label>Budget</label><input class="form-control" name="budget"></div><div class="col-md-6"><label>Area required</label><input class="form-control" name="area_required"></div></div><hr><h3>Property</h3><div class="row g-3"><div class="col-md-6"><label>Property name</label><input class="form-control" name="property_name"></div><div class="col-md-6"><label>Property type</label><input class="form-control" name="property_type"></div></div><hr><h3>Ownership</h3><div class="row g-3"><div class="col-md-4"><label>Status</label><select class="form-select" name="lead_status">{% for s in stages %}<option>{{s}}</option>{% endfor %}</select></div><div class="col-md-4"><label>Stage</label><select class="form-select" name="lead_stage">{% for s in stages %}<option>{{s}}</option>{% endfor %}</select></div><div class="col-md-4"><label>Priority</label><select class="form-select" name="priority"><option>High</option><option selected>Medium</option><option>Low</option></select></div><div class="col-md-6"><label>Assigned to</label><select class="form-select" name="assigned_to"><option value="">Unassigned</option>{% for u in users %}<option value="{{u.id}}">{{u.username}}</option>{% endfor %}</select></div><div class="col-md-6"><label>99Acres reference</label><input class="form-control" name="source_reference"></div><div class="col-md-6"><label>Lead date</label><input class="form-control" type="date" name="lead_date"></div><div class="col-md-6"><label>Next follow-up</label><input class="form-control" type="datetime-local" name="next_followup_date"></div><div class="col-12"><label>Notes</label><textarea class="form-control" name="notes" rows="4"></textarea></div><div class="col-12"><label>Disqualification reason (required if disqualified)</label><textarea class="form-control" name="lost_reason"></textarea></div></div></div></div><div class="col-lg-4"><div class="panel sticky-panel"><h3>Save lead</h3><p class="text-muted">Duplicate detection checks normalized phone, email and 99Acres reference before saving.</p><button class="btn btn-primary w-100">Create lead</button><a class="btn btn-light w-100 mt-2" href="{{url_for('leads.list_leads')}}">Cancel</a></div></div></div></form>
{% endblock %}
